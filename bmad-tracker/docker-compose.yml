services:

  # ── Serveur tracker : file watcher + SSE ─────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bmad-tracker-server
    restart: unless-stopped
    environment:
      TASKS_FILE: /app/tasks.json
    volumes:
      - ./tasks.json:/app/tasks.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/tasks"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── UI : React buildée + Nginx ────────────────────────────────────────────
  ui:
    build:
      context: ./tracker-ui
      dockerfile: Dockerfile
    container_name: bmad-tracker-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

  # ── Pipeline API (optionnel) ──────────────────────────────────────────────
