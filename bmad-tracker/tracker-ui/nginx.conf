server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tracker SSE server (port 3001)
    location /tasks {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /events {
        proxy_pass              http://server:3001;
        proxy_http_version      1.1;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_set_header        Connection '';
        proxy_set_header        Host $host;
        chunked_transfer_encoding on;
    }

    # Pipeline API (port 8000) — gates, status, log
    # "pipeline-api" = nom du service dans docker-compose si présent
    # Fallback : utiliser VITE_PIPELINE_API côté client si l'API est externe
    location /pipeline {
        proxy_pass         http://pipeline-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 60s;
    }

    location /gates {
        proxy_pass         http://pipeline-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;
}
